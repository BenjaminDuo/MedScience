<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedScience — AI for Scientific Discovery</title>
    <script>
      // Applied before the first paint, and deliberately NOT a module: React
      // mounts one frame later, so a theme set only by ThemeContext's effect
      // showed one frame of the stylesheet's default on every reload -- the
      // dark flash. This reads the same sources ThemeContext does, so the two
      // can never disagree.
      (function () {
        var theme = 'light';
        try {
          var param = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('medscience_desktop_theme');
          theme = param === 'dark' || param === 'light' ? param : saved === 'dark' ? 'dark' : 'light';
        } catch (error) {
          /* private mode / disabled storage: fall back to the default appearance */
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg-primary text-text-primary antialiased selection:bg-accent-soft selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

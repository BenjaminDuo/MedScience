name: MedScience Cross-Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PythonRunnerTool fails closed without a kernel sandbox, so without
      # this the Linux job would only ever verify the refusal path.
      # Ubuntu 24.04 ships bwrap but AppArmor blocks unprivileged user
      # namespaces, so without the sysctl every sandboxed run fails and the
      # suite only ever sees the refusal path.
      - name: Install Bubblewrap and allow unprivileged userns (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev /bin/true && echo "bwrap sandbox works"

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Build All Monorepo Workspaces
        run: npm run build

      # One step, not a hand-kept list of 11 test files. tests/run-all.ts
      # discovers every suite in packages/core/tests, gives each run a
      # throwaway MEDSCIENCE_HOME so CI never writes to a real profile, and
      # skips the suites that need network access or a personal API key --
      # which the enumerated list used to run and depend on.
      - name: Run Test Suites (core + desktop)
        run: npm test

      - name: Verify Electron Desktop Native Compilation
        run: npm --workspace=@medscience/desktop run build

      - name: Verify Portal Builds and Typechecks
        run: |
          npm --workspace=@medscience/portal run typecheck
          npm run portal:build

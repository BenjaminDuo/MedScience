name: MedScience Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the release channel is decided by asking whether this
          # tag's commit is on main, which a shallow clone cannot answer.
          fetch-depth: 0

      # main ships stable releases; every other branch ships pre-releases.
      # A tag carrying a semver pre-release suffix (v2.0.0-rc.1) is a
      # pre-release wherever it sits, so a release candidate cut from main
      # is not announced as stable.
      - name: Decide release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main || true

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            channel=prerelease
            why="tag ${GITHUB_REF_NAME} carries a semver pre-release suffix"
          elif git merge-base --is-ancestor "${GITHUB_SHA}" origin/main 2>/dev/null; then
            channel=stable
            why="commit is on main"
          else
            channel=prerelease
            why="commit is not on main (development branch)"
          fi

          echo "prerelease=$([[ $channel == prerelease ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "Release channel: ${channel} (${why})"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Build Desktop Binaries (macOS DMG / Windows EXE / Linux AppImage + deb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            chmod -R +x node_modules/7zip-bin/mac/ 2>/dev/null || true
            node node_modules/electron-builder/cli.js --mac --project packages/desktop -c electron-builder.json --config.npmRebuild=false --publish never
          elif [ "${{ runner.os }}" = "Linux" ]; then
            node node_modules/electron-builder/cli.js --linux --project packages/desktop -c electron-builder.json --config.npmRebuild=false --publish never
          else
            node node_modules/electron-builder/cli.js --win --project packages/desktop -c electron-builder.json --config.npmRebuild=false --publish never
          fi
        shell: bash

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: >-
            MedScience ${{ steps.channel.outputs.channel == 'prerelease' && 'Pre-Release' || 'Release' }}
            ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
          # All three matrix jobs upload into the same release, so only one of
          # them may append the install guide -- otherwise it lands in the
          # release notes up to three times, racily. macOS is the one that does.
          body_path: ${{ runner.os == 'macOS' && '.github/RELEASE_BODY.md' || '' }}
          append_body: true
          fail_on_unmatched_files: false
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
